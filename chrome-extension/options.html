<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GitLab Code Review - 设置</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 18px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; margin-bottom: 16px; }
    .hint { font-size: 12px; color: #666; margin-top: -12px; margin-bottom: 16px; }
    button { background: #1f75cb; color: #fff; border: none; padding: 9px 18px; border-radius: 4px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1a65b5; }
    .saved { color: #28a745; font-size: 13px; margin-left: 10px; display: none; }
  </style>
</head>
<body>
  <h1>代码审查服务设置</h1>

  <label for="serviceUrl">审查服务地址</label>
  <input type="url" id="serviceUrl" placeholder="http://your-server:8080" />
  <p class="hint">部署代码审查服务的地址，不含末尾斜杠</p>

  <label for="apiKey">API Key（可选）</label>
  <input type="password" id="apiKey" placeholder="留空则不校验" />
  <p class="hint">对应服务端 API_KEY 环境变量，内网部署可不填</p>

  <label for="gitlabToken">GitLab Token（read_api）</label>
  <input type="password" id="gitlabToken" placeholder="glpat-xxxxxxxxxxxxxxxxxxxx" />
  <p class="hint">用于读取 MR diff，需要 read_api 权限即可</p>

  <button id="save">保存设置</button>
  <span class="saved" id="savedMsg">✓ 已保存</span>

  <script src="options.js"></script>
</body>
</html>
