<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GitLab Code Review</title>
  <style>
    body { width: 220px; padding: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; color: #333; }
    p { margin: 0 0 10px; }
    a { color: #1f75cb; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <p>GitLab Code Review 插件已启用。</p>
  <p>进入 GitLab MR 页面后，点击页面中的 <strong>「AI 代码审查」</strong> 按钮即可触发审查。</p>
  <p><a id="openOptions">⚙️ 打开设置</a></p>
  <script>
    document.getElementById('openOptions').addEventListener('click', () => {
      chrome.runtime.openOptionsPage();
    });
  </script>
</body>
</html>
